<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#612c48"><meta name="description" content="Gestión comercial offline para ferias, stock, ventas y compras"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./icon-192.png"><title>THIMY CONTROL PRO</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#292432;background:#f8f6f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:#f1e8ef;color:#56243d;border-radius:11px;padding:11px 14px;font-weight:650}button:hover{filter:brightness(.97)}button.primary{background:#652c49;color:white}button.warn{background:#ffebe8;color:#a5302e}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;padding:11px;border:1px solid #dcd4da;border-radius:10px;background:white;color:#28212c}label{display:block;font-size:13px;color:#625a65;margin:9px 0 5px}.shell{max-width:1250px;margin:auto}.top{background:linear-gradient(125deg,#4b2038,#82435e);color:white;padding:19px 18px}.topin{display:flex;gap:13px;align-items:center;max-width:1250px;margin:auto}.logo{width:57px;height:57px;object-fit:contain;border-radius:15px;background:white;padding:5px}.brand{flex:1;min-width:0}.brand h1{font-size:20px;margin:0;overflow-wrap:anywhere}.brand small{color:#f3dce6}.top button{background:#ffffff28;color:white}.nav{display:flex;gap:6px;overflow:auto;padding:12px 14px;background:white;border-bottom:1px solid #eadfe6;position:sticky;top:0;z-index:2}.nav button{white-space:nowrap;font-size:13px;padding:9px 11px}.nav button.active{background:#652c49;color:white}main{padding:16px;max-width:1250px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:white;border:1px solid #e9e1e6;border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 3px 14px #3d1a3008}.stat{font-size:26px;font-weight:780;letter-spacing:-.8px;margin:7px 0}.sub{color:#746d76;font-size:12px}.muted{color:#746d76}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #eee7ec;vertical-align:top}th{color:#665a65;background:#fcfafb}td button{padding:7px 9px;font-size:12px}.tag{font-size:11px;border-radius:20px;padding:4px 8px;background:#f3eaf0;display:inline-block}.ok{color:#17714b}.bad{color:#b33b37}.bar{height:12px;background:#eee5ec;border-radius:10px;overflow:hidden}.bar>i{display:block;height:100%;background:#9d567b;border-radius:10px}h2{font-size:21px;margin:6px 0 14px}h3{font-size:16px;margin:0 0 12px}p{line-height:1.5}.empty{padding:26px;text-align:center;color:#766e76;background:#fcfafb;border-radius:12px}.notice{background:#fff7e8;border:1px solid #f2dfb5;border-radius:12px;padding:12px;font-size:13px}.foot{font-size:12px;color:#777;line-height:1.5;margin:25px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2c2430;color:white;padding:12px 18px;border-radius:12px;z-index:9;max-width:90vw}canvas{max-width:100%}@media(max-width:560px){.stat{font-size:22px}.card{padding:13px}main{padding:12px}.top{padding:13px}.brand h1{font-size:18px}}
</style></head><body><header class="top"><div class="topin"><img id="brandLogo" class="logo" src="./icon-192.png" alt="Logo del comercio"><div class="brand"><small>Panel comercial</small><h1 id="brandName">THIMY AROMAS</h1><small id="brandSub">Ventas · Inventario · Compras inteligentes</small></div><button onclick="go('config')" aria-label="Personalizar comercio">⚙️</button></div></header><nav id="nav" class="nav"></nav><main id="app"></main><script>
'use strict';const KEY='thimy_control_pro_v2';const blank=()=>({config:{name:'THIMY AROMAS',logo:'',phone:'',giftCost:0,giftThreshold:0,marginTarget:25,currency:'ARS'},products:[],sales:[],purchases:[],adjustments:[],campaigns:[],clients:[],audit:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||blank()}catch{db=blank()}for(const k of Object.keys(blank()))if(db[k]===undefined)db[k]=blank()[k];let tab='panel',editing=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n)||0);const num=n=>Number(n)||0;const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const today=()=>localDate(new Date());const stock=p=>num(p.opening)+db.purchases.filter(x=>x.productId===p.id).reduce((a,x)=>a+num(x.qty),0)+db.adjustments.filter(x=>x.productId===p.id).reduce((a,x)=>a+num(x.qty),0)-db.sales.filter(x=>x.productId===p.id&&x.type==='stock').reduce((a,x)=>a+num(x.qty),0);const sold=p=>db.sales.filter(x=>x.productId===p.id).reduce((a,x)=>a+num(x.qty),0);const profit=s=>num(s.qty)*(num(s.price)-num(s.cost)-num(s.expense))-num(s.giftCost);const revenue=s=>num(s.qty)*num(s.price);function save(action){db.audit.unshift({date:new Date().toISOString(),action});db.audit=db.audit.slice(0,300);try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('No se pudo guardar. Exportá un respaldo y reducí el tamaño del logo. '+e.message);return false}render();return true}function notify(t){let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}function go(t){tab=t;editing=null;render()}const tabs=[['panel','📊 Panel'],['vender','🛒 Vender'],['stock','📦 Productos'],['compras','🧠 Compras'],['feria','🎪 Feria'],['marketing','📣 Marketing'],['clientes','👥 Clientes'],['config','⚙️ Ajustes']];function render(){document.title=db.config.name+' | THIMY CONTROL';$('brandName').textContent=db.config.name;$('brandLogo').src=db.config.logo||'./icon-192.png';$('nav').innerHTML=tabs.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');$('app').innerHTML=({panel:panel,vender:vender,stock:productos,compras:compras,feria:feria,marketing:marketing,clientes:clientes,config:config})[tab]();}function card(title,body){return `<section class="card"><h3>${title}</h3>${body}</section>`}function empty(t){return `<div class="empty">${t}</div>`}function optProducts(includeEmpty=true){return (includeEmpty?'<option value="">Seleccionar producto</option>':'')+db.products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${money(p.price)} · ${stock(p)} disponibles</option>`).join('')}function metric(label,val,foot=''){return `<div class="card"><div class="sub">${label}</div><div class="stat">${val}</div><div class="sub">${foot}</div></div>`}function panel(){let rev=db.sales.reduce((a,s)=>a+revenue(s),0),gain=db.sales.reduce((a,s)=>a+profit(s),0),units=db.products.reduce((a,p)=>a+stock(p),0),byChannel={};db.sales.forEach(s=>byChannel[s.channel]=(byChannel[s.channel]||0)+revenue(s));let top=db.products.map(p=>({...p,sold:sold(p)})).filter(p=>p.sold).sort((a,b)=>b.sold-a.sold).slice(0,7);let max=Math.max(1,...top.map(x=>x.sold));let days=[...Array(7)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let day=localDate(d);return {day,amount:db.sales.filter(s=>s.date===day).reduce((a,s)=>a+revenue(s),0)}});let maxday=Math.max(1,...days.map(x=>x.amount));return `<h2>Resumen del negocio</h2><div class="notice">Datos reales solo después de cargar o importar tus operaciones. Esta instalación comienza vacía, sin ventas inventadas.</div><div class="cards" style="margin-top:13px">${metric('Facturación registrada',money(rev))}${metric('Contribución estimada',money(gain),'Antes de gastos fijos e impuestos no cargados')}${metric('Operaciones',db.sales.length)}${metric('Unidades en stock',units)}${metric('Productos para reponer',db.products.filter(p=>stock(p)<=num(p.min)).length)}</div><div class="cols">${card('Ventas últimos 7 días',days.map(d=>`<div class="row" style="margin:9px 0"><span style="width:38px" class="sub">${d.day.slice(5)}</span><div class="bar" style="flex:1"><i style="width:${100*d.amount/maxday}%"></i></div><span style="width:92px;text-align:right;font-size:12px">${money(d.amount)}</span></div>`).join(''))}${card('Productos más vendidos',top.length?top.map(p=>`<div class="row between" style="margin:10px 0"><span>${esc(p.name)}</span><b>${p.sold} u.</b></div>`).join(''):empty('Sin ventas registradas'))}</div>${card('Ventas por canal',Object.keys(byChannel).length?Object.entries(byChannel).map(([k,v])=>`<p>${esc(k)}: <b>${money(v)}</b></p>`).join(''):empty('Todavía no hay operaciones'))}<div class="actions"><button class="primary" onclick="go('vender')">+ Nueva venta</button><button onclick="go('stock')">Gestionar productos</button><button onclick="go('compras')">Ver recomendaciones</button></div>`}
function productos(){let rows=db.products.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="sub">${esc(p.sku||'Sin código')} · ${esc(p.category||'Sin categoría')}</div></td><td>${stock(p)} ${stock(p)<=num(p.min)?'<span class="tag bad">Bajo</span>':''}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${esc(p.mode)}</td><td><button onclick="editProduct('${p.id}')">Editar</button> <button onclick="adjustProduct('${p.id}')">Ajustar</button></td></tr>`).join('');let p=db.products.find(x=>x.id===editing);return `<h2>Inventario y catálogo</h2>${card(p?'Editar producto':'Agregar producto',`<form id="productForm" onsubmit="submitProduct(event)"><div class="fieldgrid"><div><label>Nombre *</label><input name="name" required value="${esc(p?.name||'')}"></div><div><label>Código / SKU</label><input name="sku" value="${esc(p?.sku||'')}"></div><div><label>Categoría</label><input name="category" value="${esc(p?.category||'')}"></div><div><label>Modalidad</label><select name="mode"><option value="stock" ${p?.mode==='stock'?'selected':''}>Stock y catálogo</option><option value="pedido" ${p?.mode==='pedido'?'selected':''}>Solo por pedido</option></select></div><div><label>Costo unitario ($)</label><input type="number" name="cost" min="0" step="0.01" value="${p?.cost??0}"></div><div><label>Precio de venta ($)</label><input type="number" name="price" min="0" step="0.01" value="${p?.price??0}"></div><div><label>Stock inicial (solo al crear)</label><input type="number" name="opening" step="1" min="0" value="${p?.opening??0}" ${p?'disabled':''}></div><div><label>Stock mínimo</label><input type="number" name="min" min="0" step="1" value="${p?.min??2}"></div></div><div class="actions" style="margin-top:12px"><button class="primary">${p?'Guardar cambios':'Agregar producto'}</button>${p?'<button type="button" onclick="editing=null;render()">Cancelar</button>':''}</div></form>`)}${card('Listado ('+db.products.length+')',db.products.length?`<div class="tablewrap"><table><thead><tr><th>Producto</th><th>Disponible</th><th>Costo</th><th>Precio</th><th>Tipo</th><th>Acción</th></tr></thead><tbody>${rows}</tbody></table></div>`:empty('Agregá productos o importá un CSV desde Ajustes'))}`}
function editProduct(id){editing=id;render();window.scrollTo(0,0)}function submitProduct(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;let duplicate=db.products.find(p=>p.sku&&p.sku===f.get('sku')&&p.id!==editing);if(duplicate)return alert('Ya existe un producto con ese SKU');let base={name,sku:String(f.get('sku')).trim(),category:String(f.get('category')).trim(),mode:f.get('mode'),cost:num(f.get('cost')),price:num(f.get('price')),min:num(f.get('min'))};if(editing){Object.assign(db.products.find(p=>p.id===editing),base)}else db.products.push({id:uid(),...base,opening:num(f.get('opening'))});editing=null;save('Producto creado/actualizado: '+name);notify('Producto guardado')}function adjustProduct(id){let p=db.products.find(x=>x.id===id),v=prompt('Ajuste de unidades para '+p.name+' (positivo suma, negativo resta). Disponible: '+stock(p),'0');if(v===null)return;let qty=Number(v);if(!Number.isInteger(qty)||stock(p)+qty<0)return alert('Cantidad inválida o stock insuficiente');let reason=prompt('Motivo del ajuste (inventario, pérdida, devolución, etc.)','Conteo físico');if(reason===null||!reason.trim())return;db.adjustments.push({id:uid(),productId:id,qty,date:today(),reason});save('Ajuste '+p.name+': '+qty+' ('+reason+')')}
function vender(){return `<h2>Punto de venta</h2>${card('Registrar venta',`<form onsubmit="submitSale(event)"><div class="fieldgrid"><div><label>Producto *</label><select name="productId" required onchange="saleProductChanged(this)">${optProducts()}</select></div><div><label>Modalidad</label><select name="type" id="saleType"><option value="stock">Entregar desde stock</option><option value="pedido">Pedido por catálogo (no descuenta stock)</option></select></div><div><label>Canal</label><select name="channel"><option>Feria</option><option>WhatsApp</option><option>Instagram</option><option>Venta directa</option><option>Tienda online</option></select></div><div><label>Cantidad</label><input name="qty" type="number" min="1" step="1" value="1" required></div><div><label>Precio unitario ($)</label><input name="price" id="salePrice" type="number" min="0" step="0.01" required></div><div><label>Gastos unitarios ($)</label><input name="expense" type="number" min="0" step="0.01" value="0"></div><div><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div><label>Cliente (opcional)</label><input name="client" placeholder="Nombre o referencia"></div></div><label><input type="checkbox" name="gift" style="width:auto"> Incluye regalo rosa 3D (costo: ${money(db.config.giftCost)})</label><div class="actions" style="margin-top:13px"><button class="primary">Confirmar venta</button></div></form>`)}${card('Últimas operaciones',db.sales.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Cant.</th><th>Canal</th><th>Ingreso</th><th>Contribución</th><th></th></tr></thead><tbody>${db.sales.slice().reverse().slice(0,35).map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.productName)}<div class="sub">${s.type==='pedido'?'Por encargo':'Stock'}</div></td><td>${s.qty}</td><td>${esc(s.channel)}</td><td>${money(revenue(s))}</td><td>${money(profit(s))}</td><td><button class="warn" onclick="cancelSale('${s.id}')">Anular</button></td></tr>`).join('')}</tbody></table></div>`:empty('Aún no hay ventas'))}`}
function saleProductChanged(el){let p=db.products.find(x=>x.id===el.value);if(p){$('salePrice').value=p.price;$('saleType').value=p.mode==='pedido'?'pedido':'stock'}}function submitSale(e){e.preventDefault();let f=new FormData(e.target),p=db.products.find(x=>x.id===f.get('productId')),qty=Number(f.get('qty')),price=Number(f.get('price')),expense=Number(f.get('expense'));if(!p||!Number.isInteger(qty)||qty<1||price<0||expense<0)return alert('Revisá los valores');let type=f.get('type');if(type==='stock'&&stock(p)<qty)return alert('Stock insuficiente: '+stock(p)+' disponibles');let giftCost=f.has('gift')?num(db.config.giftCost):0;let contribution=qty*(price-num(p.cost)-expense)-giftCost;if(contribution<0&&!confirm('Esta venta tiene contribución NEGATIVA ('+money(contribution)+'). ¿Registrar de todas formas?'))return;db.sales.push({id:uid(),productId:p.id,productName:p.name,cost:p.cost,qty,price,expense,channel:f.get('channel'),type,date:f.get('date'),client:f.get('client'),giftCost});save('Venta '+qty+' × '+p.name+' por '+money(qty*price));notify('Venta registrada; stock actualizado')}function cancelSale(id){let s=db.sales.find(x=>x.id===id);if(!s||!confirm('¿Anular esta venta? Se revertirá su movimiento de stock.'))return;db.sales=db.sales.filter(x=>x.id!==id);save('Venta anulada: '+s.productName)}
function compras(){let rows=db.products.map(p=>{let avail=stock(p),units=sold(p),min=num(p.min),suggest=Math.max(0,min*2-avail),margin=num(p.price)?100*(num(p.price)-num(p.cost))/num(p.price):0;return {p,avail,units,suggest,margin}}).sort((a,b)=>b.suggest-a.suggest);return `<h2>Compras inteligentes</h2><div class="notice">Recomendaciones orientativas basadas en stock mínimo y ventas registradas. No existe lectura automática del portal Natura todavía. Ninguna compra se realiza desde aquí.</div>${card('Plan de reposición',db.products.length?`<div class="tablewrap"><table><thead><tr><th>Producto</th><th>Stock</th><th>Vendidas</th><th>Margen bruto</th><th>Sugerencia</th><th>Capital estimado</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.p.name)}</td><td>${x.avail}</td><td>${x.units}</td><td>${x.margin.toFixed(1)}%</td><td>${x.p.mode==='pedido'?'Por pedido':x.suggest?'Evaluar '+x.suggest+' u.':'Sin reposición'}</td><td>${money(x.suggest*x.p.cost)}</td></tr>`).join('')}</tbody></table></div>`:empty('Importá tu catálogo para generar recomendaciones'))}${card('Registrar compra / recepción',`<form onsubmit="submitPurchase(event)"><div class="fieldgrid"><div><label>Producto</label><select name="productId" required>${optProducts()}</select></div><div><label>Unidades recibidas</label><input type="number" name="qty" min="1" step="1" required></div><div><label>Costo unitario pagado ($)</label><input type="number" name="cost" min="0" step="0.01" required></div><div><label>Fecha</label><input type="date" name="date" value="${today()}"></div><div><label>Proveedor / ciclo</label><input name="cycle" placeholder="Natura ciclo 15"></div></div><button class="primary" style="margin-top:12px">Registrar recepción y sumar stock</button></form>`)}${card('Últimas compras',db.purchases.length?db.purchases.slice().reverse().slice(0,12).map(x=>`<p>${esc(x.date)} · ${esc(db.products.find(p=>p.id===x.productId)?.name||'Producto')} · ${x.qty} u. · ${money(x.cost)} c/u · ${esc(x.cycle)}</p>`).join(''):empty('Sin compras registradas'))}`}
function submitPurchase(e){e.preventDefault();let f=new FormData(e.target),p=db.products.find(x=>x.id===f.get('productId')),qty=Number(f.get('qty')),cost=Number(f.get('cost'));if(!p||!Number.isInteger(qty)||qty<=0||cost<0)return alert('Valores inválidos');db.purchases.push({id:uid(),productId:p.id,qty,cost,date:f.get('date'),cycle:f.get('cycle')});p.cost=cost;save('Compra recibida '+qty+' × '+p.name);notify('Stock actualizado')}
function feria(){let sales=db.sales.filter(s=>s.channel==='Feria'),rev=sales.reduce((a,s)=>a+revenue(s),0),gain=sales.reduce((a,s)=>a+profit(s),0),avg=sales.length?rev/sales.length:0,eligible=db.products.filter(p=>stock(p)>0&&p.price-p.cost>num(db.config.giftCost)).sort((a,b)=>(b.price-b.cost)-(a.price-a.cost));return `<h2>Modo feria</h2><div class="cards">${metric('Ventas de feria',money(rev))}${metric('Operaciones',sales.length)}${metric('Ticket promedio',money(avg))}${metric('Contribución estimada',money(gain))}</div>${card('Promociones rentables',`<p>🎁 <b>Rosa 3D + crema Natura</b>: costo cargado ${money(db.config.giftCost)}; umbral de regalo ${money(db.config.giftThreshold)}.</p>${db.config.giftCost===0?'<div class="notice">Configurá el costo real del regalo antes de evaluar promociones.</div>':''}${eligible.length?`<p>Productos con contribución positiva antes de otros gastos:</p>${eligible.slice(0,5).map(p=>`<div class="row between"><span>${esc(p.name)} · ${stock(p)} disponibles</span><b>${money(p.price-p.cost-db.config.giftCost)}*</b></div>`).join('')}<p class="sub">* Contribución orientativa después del regalo, antes de gastos adicionales.</p>`:empty('Sin productos suficientes para recomendar combos')}`)}${card('Acceso rápido',`<div class="actions"><button class="primary" onclick="go('vender')">Registrar venta de feria</button><button onclick="go('stock')">Consultar stock</button><button onclick="go('marketing')">Crear promoción</button></div>`)}<p class="sub">Funciona sin conexión una vez instalada y cargada; las operaciones quedan guardadas en este dispositivo. No hay sincronización entre celulares.</p>`}
function marketing(){let phone=db.config.phone.replace(/\D/g,''),link=phone?'https://wa.me/'+phone+'?text='+encodeURIComponent('Hola, vi una promoción de '+db.config.name+' y quiero consultar disponibilidad'):'',rows=db.campaigns.slice().reverse().map(c=>`<tr><td>${esc(c.date)}</td><td>${esc(c.title)}</td><td>${esc(c.channel)}</td><td>${esc(c.status)}</td><td><button onclick="copyCampaign('${c.id}')">Copiar</button></td></tr>`).join('');return `<h2>Marketing y publicaciones</h2><div class="notice">Las publicaciones se preparan aquí, pero no se envían automáticamente a Instagram, Facebook o WhatsApp hasta conectar y autorizar una integración oficial. Nunca se simula una publicación exitosa.</div>${card('Crear promoción',`<form onsubmit="createCampaign(event)"><div class="fieldgrid"><div><label>Producto</label><select name="productId" required>${optProducts()}</select></div><div><label>Canal</label><select name="channel"><option>WhatsApp</option><option>Instagram</option><option>Facebook</option><option>Feria</option></select></div><div><label>Oferta / gancho</label><input name="title" value="¡Regalá algo especial!" required></div><div><label>Fecha prevista</label><input type="date" name="date" value="${today()}"></div></div><button class="primary" style="margin-top:12px">Generar borrador con precio y enlace</button></form>`)}${card('Enlace directo a WhatsApp',link?`<p><a target="_blank" rel="noopener" href="${link}">${esc(link)}</a></p><button onclick="copyText(${esc(JSON.stringify(link))})">Copiar enlace</button>`:'Configurá el número de WhatsApp Business en Ajustes (código de país incluido).')}${card('Borradores',db.campaigns.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Promoción</th><th>Canal</th><th>Estado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:empty('Todavía no hay campañas'))}`}
function createCampaign(e){e.preventDefault();let f=new FormData(e.target),p=db.products.find(x=>x.id===f.get('productId'));if(!p)return;let phone=db.config.phone.replace(/\D/g,''),link=phone?'https://wa.me/'+phone+'?text='+encodeURIComponent('Hola, quiero consultar por '+p.name):'[AGREGAR WHATSAPP EN AJUSTES]';let title=f.get('title'),text=`🌸 ${title}\n${p.name}\n💰 ${money(p.price)}\n${p.mode==='pedido'?'📦 Por catálogo, sujeto a disponibilidad':'🛍️ Consultá stock y entrega'}\n📲 Pedilo acá: ${link}\n${db.config.name}`;db.campaigns.push({id:uid(),date:f.get('date'),title,channel:f.get('channel'),text,status:'Borrador, no publicado'});save('Borrador creado: '+p.name);copyText(text)}function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>notify('Copiado')).catch(()=>prompt('Copiá este texto:',t))}else prompt('Copiá este texto:',t)}function copyCampaign(id){let c=db.campaigns.find(x=>x.id===id);if(c)copyText(c.text)}
function clientes(){let names=[...new Set(db.sales.map(s=>s.client?.trim()).filter(Boolean))],rows=names.map(n=>({name:n,sales:db.sales.filter(s=>s.client?.trim()===n)}));return `<h2>Clientes y recompra</h2>${card('Clientes registrados desde ventas',rows.length?`<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Operaciones</th><th>Gastó</th><th>Última compra</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.sales.length}</td><td>${money(r.sales.reduce((a,s)=>a+revenue(s),0))}</td><td>${esc(r.sales.map(s=>s.date).sort().at(-1))}</td></tr>`).join('')}</tbody></table></div>`:empty('Al registrar una venta podés asociar el nombre del cliente. No se importan contactos sin autorización.'))}<p class="sub">No envíes mensajes promocionales sin consentimiento. Los datos personales permanecen en este dispositivo.</p>`}
function config(){return `<h2>Configuración del comercio</h2>${card('Identidad y costos',`<form onsubmit="saveConfig(event)"><div class="fieldgrid"><div><label>Nombre del comercio</label><input name="name" required value="${esc(db.config.name)}"></div><div><label>WhatsApp Business (código de país + número)</label><input name="phone" placeholder="549291..." value="${esc(db.config.phone)}"></div><div><label>Costo total rosa 3D + crema ($)</label><input name="giftCost" type="number" min="0" step="0.01" value="${num(db.config.giftCost)}"></div><div><label>Importe mínimo para regalo ($)</label><input name="giftThreshold" type="number" min="0" step="0.01" value="${num(db.config.giftThreshold)}"></div><div><label>Margen objetivo (%)</label><input name="marginTarget" type="number" min="0" max="99" value="${num(db.config.marginTarget)}"></div><div><label>Logo del comercio (PNG/JPG/WebP)</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></div></div><button class="primary" style="margin-top:12px">Guardar identidad y preferencias</button></form>`)}${card('Importar catálogo CSV',`<p>Encabezados aceptados: <code>sku,nombre,categoria,costo,precio,stock,minimo,modalidad</code>. Los productos con el mismo SKU se actualizan; la importación no reemplaza el stock físico existente de esos productos.</p><input type="file" id="csvFile" accept=".csv,text/csv"><div class="actions" style="margin-top:12px"><button onclick="importCSV()">Importar CSV</button><button onclick="downloadTemplate()">Descargar plantilla</button></div>`)}${card('Respaldos y exportaciones',`<div class="actions"><button onclick="exportJSON()">Exportar respaldo completo JSON</button><button onclick="exportCSV()">Exportar productos CSV</button><button onclick="exportSales()">Exportar ventas CSV</button><button onclick="$('restoreFile').click()">Restaurar respaldo</button><input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreJSON(this)"></div><p class="sub">Guardá respaldos periódicos. Borrar datos del navegador puede eliminar tu información. El respaldo incluye clientes y operaciones: protegelo.</p>`)}${card('Integraciones y permisos',`<table><tr><th>Servicio</th><th>Estado</th><th>Acción necesaria</th></tr><tr><td>Natura Mi Negocio</td><td>Sin conectar</td><td>Exportar archivo autorizado desde el portal</td></tr><tr><td>Meta / Instagram</td><td>Sin conectar</td><td>Conexión oficial y permisos de publicación</td></tr><tr><td>WhatsApp Business</td><td>Enlace manual</td><td>Ingresar número; API oficial para mensajería automatizada</td></tr><tr><td>Google Drive / Sheets</td><td>Sin conectar</td><td>Backend seguro y OAuth para sincronización</td></tr></table><div class="notice">Las compras, los mensajes y las publicaciones externas no se ejecutan automáticamente. Una futura integración deberá exigir autorización verificable y mantener un registro de acciones.</div>`)}${card('Auditoría',db.audit.length?db.audit.slice(0,18).map(x=>`<p class="sub">${esc(x.date.slice(0,16).replace('T',' '))} · ${esc(x.action)}</p>`).join(''):empty('Sin movimientos'))}<p class="foot">Versión 2.0 local. Funcional sin servidor para un solo dispositivo. No es un SaaS multiusuario ni un sistema de sincronización. Requiere hosting HTTPS para instalarse como PWA y backend para comercialización.</p>`}
async function saveConfig(e){e.preventDefault();let f=new FormData(e.target);for(let k of ['name','phone'])db.config[k]=String(f.get(k)).trim();for(let k of ['giftCost','giftThreshold','marginTarget'])db.config[k]=num(f.get(k));let file=$('logoFile').files[0];if(file){if(file.size>350000) return alert('Elegí una imagen menor a 350 KB para evitar problemas de almacenamiento');let data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});db.config.logo=data}save('Configuración actualizada');notify('Comercio personalizado')}
function csvParse(t){let sep=(t.split(/\r?\n/)[0].match(/;/g)||[]).length>(t.split(/\r?\n/)[0].match(/,/g)||[]).length?';':',';let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===sep&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function importCSV(){let file=$('csvFile').files[0];if(!file)return alert('Seleccioná un CSV');let text=await file.text(),rows=csvParse(text.replace(/^\uFEFF/,''));if(rows.length<2)return alert('El CSV no contiene productos');let keys=rows.shift().map(x=>x.trim().toLowerCase());let ix=k=>keys.indexOf(k);if(ix('nombre')<0||ix('precio')<0)return alert('Faltan columnas nombre y precio');let count=0,updated=0;for(let r of rows){let get=k=>ix(k)<0?'':(r[ix(k)]||'').trim(),name=get('nombre'),sku=get('sku');if(!name)continue;let numeric=k=>num(get(k).replace(/\$/g,'').replace(/\s/g,'').replace(/\./g,'').replace(',','.'));let p=sku?db.products.find(x=>x.sku===sku):null;let obj={name,sku,category:get('categoria'),cost:numeric('costo'),price:numeric('precio'),min:numeric('minimo')||2,mode:get('modalidad')==='pedido'?'pedido':'stock'};if(p){Object.assign(p,obj);updated++}else{db.products.push({id:uid(),...obj,opening:numeric('stock')});count++}}save('CSV importado: '+count+' nuevos, '+updated+' actualizados');alert('Importados '+count+' productos nuevos y actualizados '+updated+'. Revisá costos y precios antes de vender.')}
function download(name,text,type='text/plain'){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csvValue(v){let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}function downloadTemplate(){download('plantilla_productos_thimy.csv','sku,nombre,categoria,costo,precio,stock,minimo,modalidad\nNAT001,Ejemplo crema,Corporal,8500,14500,4,2,stock\n','text/csv;charset=utf-8')}function exportJSON(){download('THIMY_respaldo_'+today()+'.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){let head=['sku','nombre','categoria','costo','precio','stock','minimo','modalidad'],rows=db.products.map(p=>[p.sku,p.name,p.category,p.cost,p.price,stock(p),p.min,p.mode]);download('THIMY_productos_'+today()+'.csv','\uFEFF'+[head,...rows].map(r=>r.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8')}function exportSales(){let head=['fecha','producto','cantidad','precio','costo','gasto_unitario','costo_regalo','canal','tipo','cliente'],rows=db.sales.map(s=>[s.date,s.productName,s.qty,s.price,s.cost,s.expense,s.giftCost,s.channel,s.type,s.client]);download('THIMY_ventas_'+today()+'.csv','\uFEFF'+[head,...rows].map(r=>r.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8')}async function restoreJSON(el){let f=el.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d||!Array.isArray(d.products)||!Array.isArray(d.sales)||!d.config||!Array.isArray(d.purchases)||!Array.isArray(d.adjustments))throw Error('Formato incompatible');if(!confirm('¿Reemplazar TODOS los datos actuales por el respaldo? Exportá primero una copia.'))return;db={...blank(),...d};save('Respaldo restaurado');notify('Respaldo restaurado')}catch(e){alert('No se pudo restaurar: '+e.message)}}render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(error=>{console.error('No se pudo activar el modo sin conexión',error);notify('No se activó el modo sin conexión. Revisá la conexión y recargá.')}));
</script></body></html>
